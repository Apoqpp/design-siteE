
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DESIGN - خدمات التصميم</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #111;
      color: white;
      padding: 20px 0;
    }
    header h1 {
      margin: 0;
      font-size: 2.5em;
    }
    section {
      padding: 40px 20px;
    }
    .services {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .service {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
      width: 280px;
    }
    .service h3 {
      margin-top: 0;
    }
    .contact {
      margin-top: 40px;
    }
    .contact a {
      display: inline-block;
      background-color: #25D366;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1.2em;
    }
  </style>
</head>
<body>

  <header>
    <h1>DESIGN</h1>
    <p>خدمات احترافية في تصميم الصور، الشعارات، والمونتاج</p>
  </header>

  <section>
    <h2>خدماتنا</h2>
    <div class="services">
      <div class="service">
        <h3>تصميم صور</h3>
        <p>نقوم بإنشاء صور جذابة لأي محتوى أو إعلان.</p>
      </div>
      <div class="service">
        <h3>تصميم شعارات</h3>
        <p>شعارات احترافية تعكس هوية علامتك.</p>
      </div>
      <div class="service">
        <h3>مونتاج فيديو</h3>
        <p>مونتاج احترافي للفيديوهات بجودة عالية.</p>
      </div>
    </div>
    
    <div class="contact">
      <h2>تواصل معنا</h2>
      <a href="https://wa.me/رقمك" target="_blank">تواصل عبر واتساب</a>
    </div>
  </section>

</body>
</html>
